name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  VULKAN_SDK_VERSION: "1.4.363.0"

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format
      - name: Check formatting
        run: python scripts/ci.py format

  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        preset: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang-format clang-tidy \
            libvulkan-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev xorg-dev
      - name: Install Vulkan SDK with MoltenVK
        if: runner.os == 'macOS'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
          stripdown: false
      - name: Build and run headless engine tests
        run: python scripts/ci.py test --preset ${{ matrix.preset }}

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy libvulkan-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev xorg-dev
      - name: Run clang-tidy
        run: python scripts/ci.py lint

  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, ubsan]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev xorg-dev
      - name: Build and run tests with sanitizers
        run: python scripts/ci.py test --preset ${{ matrix.preset }}
